<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaso parcial 2 · MCF5272</title>
<style>
  :root{
    --bg:#eef1ef; --surface:#ffffff; --surface-2:#f3f5f3; --line:#ccd4d1;
    --text:#16211f; --text-muted:#51615d;
    --accent:#b96a1f; --accent-soft:#f0ddc4; --accent-ink:#2a1700;
    --accent2:#1f8a7f; --accent2-soft:#dbeeeb;
    --good:#2f9d5e; --good-soft:#dff3e7; --bad:#d1453f; --bad-soft:#fbe4e2;
    --mono-bg:#101715; --mono-text:#d8e4e0; --mono-line:#223029;
    --shadow:0 10px 30px -14px rgba(20,30,28,.25);
    --f-display:"Bahnschrift SemiBold","Bahnschrift","Segoe UI Semibold","Arial Narrow",sans-serif;
    --f-body:"Segoe UI",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --f-mono:"Cascadia Code",ui-monospace,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11161c; --surface:#1a2129; --surface-2:#212a33; --line:#2d3844;
      --text:#e7edf0; --text-muted:#93a1ab;
      --accent:#e08f3c; --accent-soft:#3a2c1a; --accent-ink:#1a1206;
      --accent2:#52b7ab; --accent2-soft:#17302d;
      --good:#4ecb86; --good-soft:#123323; --bad:#ec6a63; --bad-soft:#2e1a19;
      --mono-bg:#0c1014; --mono-text:#cfe8df; --mono-line:#223029;
      --shadow:0 10px 30px -12px rgba(0,0,0,.55);
    }
    :root:not([data-theme="light"]) .rail-btn.active .t, :root:not([data-theme="light"]) .rail-btn.active .s{ color:#fde8cf; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--f-body); line-height:1.55; font-size:16px; }
  h1,h2,h3{ font-family:var(--f-display); font-weight:700; text-wrap:balance; margin:0; letter-spacing:.01em; }
  code,.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
  a{ color:var(--accent2); }
  button{ font-family:var(--f-body); cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent2); outline-offset:2px; }
  .app{ max-width:1180px; margin:0 auto; padding:0 20px 80px; }
  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:28px 0 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{ font-family:var(--f-display); font-weight:700; font-size:13px; letter-spacing:.14em; background:var(--text); color:var(--bg); padding:6px 9px; border-radius:3px; line-height:1; }
  .brand h1{ font-size:26px; }
  .brand p{ margin:2px 0 0; color:var(--text-muted); font-size:14px; }
  .scorepill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--f-display); font-size:12.5px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:6px 13px; color:var(--text-muted); }
  .scorepill strong{ color:var(--accent); }
  .layout{ display:grid; grid-template-columns:200px 1fr; gap:28px; margin-top:24px; align-items:start; }
  .layout>*{ min-width:0; }
  .rail{ position:sticky; top:20px; display:flex; flex-direction:column; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px; }
  @media (max-width:760px){ .layout{ grid-template-columns:1fr; } .rail{ position:static; flex-direction:row; overflow-x:auto; gap:8px; } }
  .rail-btn{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; border:1px solid transparent; background:transparent; color:var(--text-muted); padding:10px 12px; border-radius:7px; text-align:left; white-space:nowrap; }
  .rail-btn .t{ font-family:var(--f-display); font-size:14px; color:var(--text); }
  .rail-btn .s{ font-size:11.5px; color:var(--text-muted); }
  .rail-btn:hover{ background:var(--surface-2); }
  .rail-btn.active{ background:var(--accent-soft); border-color:var(--accent); }
  .rail-btn.active .t,.rail-btn.active .s{ color:var(--accent-ink); }
  .panel{ display:none; flex-direction:column; gap:18px; }
  .panel.active{ display:flex; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 22px; box-shadow:var(--shadow); }
  @media (max-width:520px){ .card{ padding:16px; } }
  .card h2{ font-size:20px; margin-bottom:6px; }
  .card h3{ font-size:15.5px; }
  .card p{ margin:0 0 10px; max-width:70ch; }
  .muted{ color:var(--text-muted); }
  .eyebrow{ font-family:var(--f-display); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:6px; }
  .ex-head{ display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .tag{ font-size:11.5px; font-family:var(--f-display); letter-spacing:.03em; padding:3px 9px; border-radius:999px; background:var(--accent2-soft); color:var(--accent2); border:1px solid var(--accent2); white-space:nowrap; }
  .tag.gen{ background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent); }
  table{ border-collapse:collapse; width:100%; font-size:14px; }
  .tablewrap{ overflow-x:auto; border:1px solid var(--line); border-radius:8px; margin:8px 0; }
  th,td{ padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; }
  th{ background:var(--surface-2); font-family:var(--f-display); font-size:12.5px; color:var(--text-muted); white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  .codebox{ background:var(--mono-bg); color:var(--mono-text); border:1px solid var(--mono-line); border-radius:8px; padding:12px 14px; font-family:var(--f-mono); font-size:13px; overflow-x:auto; line-height:1.55; white-space:pre; margin:8px 0; }
  .fields{ display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; }
  .field{ display:flex; flex-direction:column; gap:4px; min-width:104px; flex:0 1 auto; max-width:100%; }
  .field label{ font-size:12px; color:var(--text-muted); font-family:var(--f-display); letter-spacing:.02em; }
  .field input,.field select{ font-family:var(--f-mono); font-size:14px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--text); width:100%; max-width:100%; }
  .casehead{ flex:0 0 100%; font-size:14.5px; font-weight:600; margin-top:6px; padding-top:8px; border-top:1px dashed var(--line); }
  .casehead:first-child{ border-top:none; margin-top:0; padding-top:0; }
  .ok{ border-color:var(--good) !important; background:var(--good-soft) !important; }
  .bad{ border-color:var(--bad) !important; background:var(--bad-soft) !important; }
  .btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .btn{ font-family:var(--f-display); font-size:13px; letter-spacing:.02em; border-radius:7px; padding:9px 16px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); }
  .btn:hover{ background:var(--line); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .chip{ font-size:13px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--text-muted); }
  .chip.okc{ background:var(--good-soft); border-color:var(--good); color:var(--good); }
  .chip.badc{ background:var(--bad-soft); border-color:var(--bad); color:var(--bad); }
  details.solution{ margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; }
  details.solution summary{ cursor:pointer; font-family:var(--f-display); font-size:13px; color:var(--accent2); }
  details.solution .body{ margin-top:8px; font-size:14px; }
  details.solution p{ font-size:14px; margin-bottom:8px; }
  details.solution ul{ margin:6px 0; padding-left:18px; }
  details.solution li{ margin-bottom:4px; }
  details.hoja summary{ cursor:pointer; font-family:var(--f-display); font-size:14px; }
  details.solution .body{ overflow-x:auto; }
  svg.fsm{ width:100%; min-width:640px; height:auto; display:block; margin:10px 0; max-width:760px; }
  svg.fsm text{ font-family:var(--f-body); fill:var(--text); }
  svg.fsm .st{ fill:var(--accent-soft); stroke:var(--accent); stroke-width:1.5; }
  svg.fsm .ar{ fill:none; stroke:var(--text-muted); stroke-width:1.5; }
  svg.fsm .ah{ fill:var(--text-muted); }
  svg.fsm .sn{ font-family:var(--f-display); font-size:14px; font-weight:700; }
  svg.fsm .lb{ font-size:11.5px; }
  .quiz-q{ margin-bottom:12px; }
  .quiz-opts{ display:flex; flex-direction:column; gap:8px; }
  .quiz-opt{ text-align:left; border:1px solid var(--line); background:var(--surface-2); border-radius:8px; padding:10px 14px; font-size:14.5px; color:var(--text); }
  .quiz-opt:hover{ background:var(--line); }
  .quiz-exp{ margin-top:12px; font-size:14px; color:var(--text-muted); border-top:1px dashed var(--line); padding-top:10px; }
  footer{ color:var(--text-muted); font-size:12.5px; margin-top:24px; text-align:center; }
</style>

<div class="app">
  <div class="topbar">
    <div class="brand"><span class="brand-mark">SDGI</span>
      <div><h1>Repaso para el parcial 2</h1><p>Interrupciones, temporizadores, UART, estados y C en el MCF5272</p></div></div>
    <span class="scorepill">Aciertos en esta sesión: <strong id="streak">0</strong></span>
  </div>
  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main id="main"></main>
  </div>
  <footer>Basado en las unidades 4 a 6, sus cuestiones y problemas, y el examen de enero de 2016. Comprueba siempre contra tus apuntes.</footer>
</div>

<script>
(function(){
'use strict';
// ---------- utilidades ----------
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const hex=(n,d)=>(n>>>0).toString(16).toUpperCase().padStart(d,'0');
const bin=(n,d)=>(n>>>0).toString(2).padStart(d,'0');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fnum=(x,d=3)=>String(+x.toFixed(d)).replace('.',',');
const normHex=s=>String(s).trim().toUpperCase().replace(/^\$/,'').replace(/^0X/,'').replace(/^0+(?=.)/,'');
const code=s=>`<div class="codebox">${esc(s.replace(/^\n/,'').replace(/\n\s*$/,''))}</div>`;
const SINO=[['si','Sí'],['no','No']];

// ---------- modelo del MCF5272 (funciones puras) ----------
const OFF={INT1:1,INT2:2,INT3:3,INT4:4,TMR0:5,TMR1:6,TMR2:7,TMR3:8,UART1:9,UART2:10,PLIP:11,PLIA:12,USB0:13,USB1:14,USB2:15,USB3:16,USB4:17,USB5:18,USB6:19,USB7:20,DMA:21,ERX:22,ETX:23,ENTC:24,QSPI:25,INT5:26,INT6:27,SWTO:28};
const ICR={1:['INT1','INT2','INT3','INT4','TMR0','TMR1','TMR2','TMR3'],2:['UART1','UART2','PLIP','PLIA','USB0','USB1','USB2','USB3'],3:['USB4','USB5','USB6','USB7','DMA','ERX','ETX','ENTC'],4:['QSPI','INT5','INT6','SWTO']};
const icrOf=s=>+Object.keys(ICR).find(r=>ICR[r].includes(s));
const icrValue=m=>{ let v=0,reg=0; Object.keys(m).forEach(s=>{ reg=icrOf(s); v=(v|((8|m[s])<<(28-4*ICR[reg].indexOf(s))))>>>0; }); return v; };
const vectorAddr=(pivr,s)=>(pivr+OFF[s])*4;
const pivrFrom=(addr,s)=>addr/4-OFF[s];
const orderFromIcr1=v=>[0,1,2,3].map(i=>({s:'INT'+(i+1),l:(v>>>(28-4*i))&7,i})).sort((a,b)=>b.l-a.l||a.i-b.i).map(x=>x.s);
const pitr=edges=>{ const bit={INT1:31,INT2:30,INT3:29,INT4:28,INT5:6,INT6:5}; let v=0; Object.keys(edges).forEach(k=>{ if(edges[k]) v=(v|(1<<bit[k]))>>>0; }); return v; };
const a7After=(a7,pushed)=>((a7-(a7%4))-8-pushed)>>>0;
const tmr=o=>((o.ps||0)<<8|(o.ce||0)<<6|(o.om||0)<<5|(o.ori||0)<<4|(o.frr||0)<<3|(o.clk||0)<<1|(o.rst||0))>>>0;
const tmrDecode=v=>({ps:v>>>8,ce:(v>>6)&3,om:(v>>5)&1,ori:(v>>4)&1,frr:(v>>3)&1,clk:(v>>1)&3,rst:v&1});
const divOf=clk=>clk===2?16:1;
const tIrq=(fHz,ps,clk,trr)=>trr*(ps+1)*divOf(clk)/fHz;
const pwcr=o=>((o.en||0)<<7|(o.frc||0)<<6|(o.lvl||0)<<5|(o.cksl||0))>>>0;
const fPwm=(f,c)=>f/(256*2**c);
const ckslClosest=(f,t)=>{ let b=0; for(let c=0;c<=15;c++) if(Math.abs(fPwm(f,c)-t)<Math.abs(fPwm(f,b)-t)) b=c; return b; };
const ckslAbove=(f,t)=>{ let b=0; for(let c=0;c<=15;c++) if(fPwm(f,c)>t) b=c; return b; };
const BAUD=[1200,4800,9600,19200];
const xcr=o=>(o.br<<5|o.dt<<4|o.st<<3|o.pr<<2|o.tx<<1|o.rx)>>>0;
const xcrDecode=v=>({br:(v>>5)&3,dt:(v>>4)&1,st:(v>>3)&1,pr:(v>>2)&1,tx:(v>>1)&1,rx:v&1});
const frameLen=(o,guard=0)=>1+(o.dt?8:7)+1+(o.st?2:1)+guard;
const frameBits=(val,o)=>{ const n=o.dt?8:7, d=bin(val&((1<<n)-1),n), ones=d.split('1').length-1; const par=o.pr?(ones%2?0:1):(ones%2?1:0); return '0'+d+par+(o.st?'00':'0'); };
const cmpFlags=(d,f)=>{ d>>>=0; f>>>=0; const r=(d-f)>>>0; return {N:r>>>31,Z:r===0?1:0,C:d<f?1:0,V:(((d^f)&(d^r))>>>31)}; };
const BR={BEQ:x=>x.Z,BNE:x=>!x.Z,BHI:x=>!x.C&&!x.Z,BLS:x=>x.C||x.Z,BCC:x=>!x.C,BCS:x=>x.C,BGT:x=>(x.N===x.V)&&!x.Z,BLE:x=>x.Z||x.N!==x.V,BGE:x=>x.N===x.V,BLT:x=>x.N!==x.V};
const PROD=[[1,189,'Platanos'],[2,285,'Manzanas Golden'],[3,320,'Tomate pera'],[4,1495,'Queso curado'],[5,3990,'Jamon serrano'],[6,549,'Pollo entero']];
const precio=(cod,peso,v=0,umbral=0)=>{ const i=PROD.findIndex(p=>p[0]===cod), pk=i<0?0xFFFF:PROD[i][1], idx=i<0?6:i; let p;
  if(v===1) p=Math.floor(peso/100)*pk; else p=Math.floor(peso*pk/100);
  p&=0xFFFF; if(v===2&&peso>=umbral) p=(p-Math.floor(p/10))&0xFFFF; return {p,pk,dir:0x100000+24*idx}; };
const cadena=p=>{ const s=String(p%100000).padStart(5,'0'); return s.slice(0,3)+'.'+s.slice(3); };

// ---------- hoja de consulta ----------
const HOJA=`<details class="hoja"><summary>Hoja de consulta (la misma información que tienes en el examen)</summary>
<div class="tablewrap"><table><tr><th>Registro</th><th>Campos, de bit alto a bajo</th></tr>
<tr><td><code>TMRn</code></td><td><code>PS(15-8) CE(7-6) OM(5) ORI(4) FRR(3) CLK(2-1) RST(0)</code></td></tr>
<tr><td><code>CLK</code></td><td>00 detiene · 01 reloj del sistema · 10 reloj del sistema / 16 · 11 TINn</td></tr>
<tr><td><code>CE</code></td><td>00 sin captura · 01 subida · 10 bajada · 11 ambos (con interrupción)</td></tr>
<tr><td><code>TERn</code></td><td><code>REF(1) CAP(0)</code>; se ponen a 0 escribiendo un 1</td></tr>
<tr><td><code>XCRn</code></td><td><code>-(7) BR(6-5) DT(4) ST(3) PR(2) TX(1) RX(0)</code></td></tr>
<tr><td><code>BR</code></td><td>00 1200 · 01 4800 · 10 9600 · 11 19200</td></tr>
<tr><td><code>XSRn</code></td><td><code>TE(5) OV(4) FR(3) PR(2) TX(1) RX(0)</code></td></tr>
<tr><td><code>PWCRn</code></td><td><code>EN(7) FRC1(6) LVL(5) CKSL(3-0)</code></td></tr>
<tr><td><code>PIVR</code></td><td><code>IV(7-5)</code>; los bits 4-0 los pone la fuente</td></tr>
<tr><td><code>ICR1</code></td><td>INT1 INT2 INT3 INT4 TMR0 TMR1 TMR2 TMR3 (PI + IPL, 4 bits cada una)</td></tr>
<tr><td><code>ICR2</code></td><td>UART1 UART2 PLIP PLIA USB0 USB1 USB2 USB3</td></tr>
<tr><td><code>ICR3</code></td><td>USB4 USB5 USB6 USB7 DMA ERX ETX ENTC</td></tr>
<tr><td><code>ICR4</code></td><td>QSPI INT5 INT6 SWTO</td></tr>
<tr><td><code>PITR</code></td><td>INT1(31) INT2(30) INT3(29) INT4(28) INT5(6) INT6(5); 1 = subida</td></tr>
</table></div>
<div class="tablewrap"><table><tr><th>Offset</th><th>Fuente</th><th>Offset</th><th>Fuente</th></tr>
<tr><td>0</td><td>Espuria</td><td>13-20</td><td>USB0-USB7</td></tr>
<tr><td>1-4</td><td>INT1-INT4</td><td>21</td><td>DMA</td></tr>
<tr><td>5-8</td><td>TMR0-TMR3</td><td>22-24</td><td>ERX, ETX, ENTC</td></tr>
<tr><td>9-10</td><td>UART1-UART2</td><td>25</td><td>QSPI</td></tr>
<tr><td>11-12</td><td>PLIP-PLIA</td><td>26-27 · 28</td><td>INT5-INT6 · SWTO</td></tr>
</table></div>
<div class="tablewrap"><table><tr><th>CMP f,d</th><th>Sin signo</th><th>Con signo</th><th>TST d</th><th>Sin signo</th><th>Con signo</th></tr>
<tr><td>d = f</td><td>BEQ</td><td>BEQ</td><td>d = 0</td><td>BEQ</td><td>BEQ</td></tr>
<tr><td>d ≠ f</td><td>BNE</td><td>BNE</td><td>d ≠ 0</td><td>BNE</td><td>BNE</td></tr>
<tr><td>d &gt; f</td><td>BHI</td><td>BGT</td><td>d &gt; 0</td><td>BNE</td><td>BGT</td></tr>
<tr><td>d ≥ f</td><td>BCC</td><td>BGE</td><td>d ≥ 0</td><td>-</td><td>BGE, BPL</td></tr>
<tr><td>d &lt; f</td><td>BCS</td><td>BLT</td><td>d &lt; 0</td><td>-</td><td>BLT, BMI</td></tr>
<tr><td>d ≤ f</td><td>BLS</td><td>BLE</td><td>d ≤ 0</td><td>-</td><td>BLE</td></tr>
</table></div></details>`;

// ---------- diagramas ----------
let fsmId=0;
function fsm(w,h,states,arrows){
  const mid='ah'+(++fsmId);
  const defs=`<defs><marker id="${mid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>`;
  const a=arrows.map(r=>`<path class="ar" d="${r.d}" marker-end="url(#${mid})"/>`+r.l.map(t=>`<text class="lb" x="${t[0]}" y="${t[1]}" text-anchor="${t[3]||'middle'}">${esc(t[2])}</text>`).join('')).join('');
  const s=states.map(t=>`<rect class="st" x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="10"/><text class="sn" x="${t.x+t.w/2}" y="${t.y+t.h/2+(t.v?-3:5)}" text-anchor="middle">${esc(t.n)}</text>`+(t.v?`<text class="lb" x="${t.x+t.w/2}" y="${t.y+t.h/2+13}" text-anchor="middle">${esc(t.v)}</text>`:'')).join('');
  return `<svg class="fsm" viewBox="0 0 ${w} ${h}" role="img">${defs}${a}${s}</svg>`;
}
const FSM_PISCINA=fsm(820,350,[
  {n:'NoCarrera',v:'EST_CARRERA = 0',x:320,y:20,w:180,h:58},
  {n:'Preparados',v:'EST_CARRERA = 1',x:40,y:230,w:180,h:58},
  {n:'Carrera',v:'EST_CARRERA = 2',x:600,y:230,w:180,h:58}],[
  {d:'M320 50 C210 60 130 130 110 230',l:[[165,92,'INT1 (S) · INT_SAL','end'],[165,108,'EST_CARRERA = 1, máscara 0','end']]},
  {d:'M180 230 C205 170 280 120 350 78',l:[[285,165,'INT1 con SAL_FALS ≠ 0','start'],[285,181,'EST_CARRERA = 0, máscara 3','start']]},
  {d:'M220 262 L600 262',l:[[410,252,'INT1 con SAL_FALS = 0 · EST_CARRERA = 2']]},
  {d:'M690 230 C670 150 590 90 500 58',l:[[645,92,'FIN_CARRERA = 1 (INT_TEMP),','start'],[645,108,'INICIO_SW: EST_CARRERA = 0','start']]},
  {d:'M80 288 C60 330 200 330 180 288',l:[[130,345,'INT2 · INT_TEMP: SAL_FALS |= PDATA']]},
  {d:'M640 288 C620 330 760 330 740 288',l:[[690,345,'INT2 · INT_TEMP: T_CARRERA++']]}]);

 <p>El nivel va de 1 a 7 (0 inhabilita). Una interrupción de nivel N se acepta si N &gt; máscara del SR, salvo el nivel 7, que se acepta siempre. Con la misma prioridad manda el orden de las fuentes, de INT1 a SWTO.</p>

TABS.push({id:'tmr',t:'Tiempos y TMR',s:'Frecuencia → tiempo, PS, TRR',intro:`<span class="eyebrow">Fórmulas</span><h2>T = TRR × (PS + 1) × D / f<sub>CLK</sub></h2>
 <p>D es 16 si CLK = 10 y 1 si CLK = 01. Onda cuadrada: f = f<sub>CONT</sub> / (2 × TRR), con OM = 1. PWM: f<sub>PWM</sub> = f<sub>CLK</sub> / (256 × 2<sup>CKSL</sup>).</p>
 <p class="muted">Periódica: FRR = 1, ORI = 1. Una sola vez: FRR = 0, ORI = 1. RST = 1 arranca ya; RST = 0 lo deja para después.</p>`,ex:[
 {title:'Calcular PS y TMR',random:1,gen(){ let f,K,trr,clk,t; do{ f=pick([12,20,25,48,50,64,66])*1e6; clk=pick([1,2]); K=pick([8,10,16,20,25,32,40,50,64,80,100,125,128,160,200,250,256]); trr=pick([1000,2000,2500,4000,5000,8000,10000,11000,12500,20000,25000,50000]); t=tIrq(f,K-1,clk,trr)*1000; }while(Math.abs(t*1000-Math.round(t*1000))>1e-6);

     f:[{k:'p',l:'PS ($)',t:'hex',a:hex(K-1,2)},{k:'c',l:'CLK',t:'bin',a:bin(clk,2)},{k:'fr',l:'FRR',t:'bin',a:mode==='per'?'1':'0'},{k:'o',l:'ORI',t:'bin',a:'1'},{k:'r',l:'RST',t:'bin',a:String(rst)},{k:'v',l:`TMR${n} ($)`,t:'hex',a:hex(v,4),w:1}],
     sol:`<p>PS + 1 = T × f / (TRR × D) = ${fnum(t/1000,6)} × ${f} / (${trr} × ${divOf(clk)}) = ${K}, luego PS = $${hex(K-1,2)}. Parte baja: CE = 00, OM = 0, ORI = 1, FRR = ${mode==='per'?1:0}, CLK = ${bin(clk,2)}, RST = ${rst}. <strong>TMR${n} = $${hex(v,4)}</strong>.</p>`}; }},
 {title:'Calcular el tiempo a partir de TMR y TRR',random:1,gen(){ const f=pick([12,20,25,48,50,64,66])*1e6, sq=Math.random()<.4, n=sq?rnd(0,1):rnd(0,3), K=pick([10,20,25,32,50,64,80,100,128,200,256]), clk=pick([1,2]), trr=rnd(100,60000), v=tmr({ps:K-1,om:sq?1:0,ori:sq?0:1,frr:1,clk,rst:1});

 {title:'Calcular TRR',random:1,gen(){ let f,K,clk,trr,t,sq; do{ f=pick([20,25,48,50,64])*1e6; K=pick([10,20,25,50,64,100,125,200,250]); clk=pick([1,2]); trr=rnd(10,500)*50; sq=Math.random()<.35; t=trr*K*divOf(clk)/f*(sq?2:1); }while(trr>65535||Math.abs(t*1e6-Math.round(t*1e6))>1e-6);

TABS.push({id:'fsm',t:'Diagramas de estados',s:'Saltos, interrupciones, variables',intro:`<span class="eyebrow">Método</span><h2>Busca la variable de estado y quién la escribe</h2>
 <p>Para cada cambio pregúntate: qué rutina escribe la variable, qué interrupción lanza esa rutina y qué condición comprueba antes. Si una rutina no cambia la variable, es un bucle sobre el mismo estado.</p>
 <p class="muted">Los problemas U4-1 y U6-1 no traen solucionario en tu carpeta: estas soluciones están deducidas del listado. La tercera parte del robot sí se apoya en la solución de enero de 2016.</p>`,ex:[
 {title:'Piscina: diagrama de estados',tag:'Problema U4-1, 4.1',gen:fix({q:`Sistema de cronometraje con <code>EST_CARRERA</code>: 0 = NoCarrera, 1 = Preparados, 2 = Carrera. INT1 (señal S, nivel 5) lanza INT_SAL; la interrupción periódica INT2 (1 ms, nivel 2) lanza INT_TEMP.`,code:`INT_SAL  tst.b   EST_CARRERA
         bne     E_PREPARADOS
         ...                      * Luz verde, máscara a 0 en la pila
         move.b  #1,EST_CARRERA   * Lee PV: ESTILO y N_VUELTAS
         bra     SALIR
E_PREPARADOS
         tst.b   SAL_FALS
         bne     FALLO
         move.b  #2,EST_CARRERA
         bra     SALIR
FALLO    ...                      * Luz roja, DISP_FALLO
         move.b  #0,EST_CARRERA
         clr.b   SAL_FALS         * Máscara a 3 en la pila
SALIR    ...  rte

INT_TEMP cmp     #1,EST_CARRERA
         bne     E_CARRERA
         ...                      * SAL_FALS |= PDATA
         bra     FIN_TEMP
E_CARRERA ...                     * T_CARRERA++, N_CALLE, FIN_CALLES
         cmpi    #8,FIN_CALLES
         bne     FIN_TEMP
         move.b  #1,FIN_CARRERA   * Máscara a 3 en la pila
FIN_TEMP ...  rte

PPAL     tst.b   FIN_CARRERA      * Bucle del principal
         beq     PPAL
         bsr     DISP_TIEMP
         bra     INICIO           * INICIO_SW: clr.b EST_CARRERA`,
   f:rows('p',[['Preparados','INT_SAL (INT1)','EST_CARRERA = 1'],['Preparados','INT_TEMP (INT2)','SAL_FALS |= PDATA'],['Carrera','INT_SAL (INT1)','EST_CARRERA = 2'],['NoCarrera','INT_SAL (INT1)','EST_CARRERA = 0'],['Carrera','INT_TEMP (INT2)','T_CARRERA + 1'],['NoCarrera','Programa principal (sin interrupción)','EST_CARRERA = 0']],P_ST,P_RUT,P_VAR,['En NoCarrera, el juez pulsa (S).','En Preparados, llega el pulso periódico.','En Preparados, el juez pulsa y <code>SAL_FALS = 0</code>.','En Preparados, el juez pulsa y <code>SAL_FALS ≠ 0</code>.','En Carrera, llega el pulso periódico y aún no han terminado todas las calles.','En Carrera, tras el último pulso <code>FIN_CARRERA = 1</code> y el principal lo detecta.']),
   sol:FSM_PISCINA+`<p>INT_SAL distingue por <code>EST_CARRERA</code> y por <code>SAL_FALS</code>. <code>INICIO_SW</code> devuelve a NoCarrera tras <code>DISP_TIEMP</code>.</p>`})},
 {title:'Piscina: máscaras y configuración',tag:'Problema U4-1, 2 y 3',gen:fix({q:'<code>PIVR = $40</code>. S va por INT1 con nivel 5 y la periódica por INT2 con nivel 2. <code>INICIO_INT</code> parte de <code>SR = $2700</code> y hace <code>ANDI #$FBFF</code>.',f:[{k:'j',l:'Vector INT_TEMP ($)',t:'hex',a:'108'},{k:'k',l:'Vector INT_SAL ($)',t:'hex',a:'104'},{k:'l',l:'ICR1 ($)',t:'hex',a:'DA000000',w:1},{k:'m',l:'Máscara resultante',t:'int',a:3},{k:'e',l:'¿Entra INT_TEMP en NoCarrera?',t:'sel',o:SINO,a:'no'}],sol:'<p>Vectores: (64 + 2) × 4 = $108 y (64 + 1) × 4 = $104. ICR1: $D y $A. $2700 AND $FBFF = $2300: máscara 3. El nivel 2 no pasa la máscara, así que INT_TEMP no entra en NoCarrera; sí el nivel 5.</p>'})},
 {title:'Piscina: casos límite',tag:'Problema U4-1, 4.3 y 4.4',gen:fix({q:'<code>T_CARRERA</code> es un <code>uint32_t</code> que cuenta milisegundos. Hay 8 calles.',f:[{k:'t',l:'Tiempo máximo (días)',t:'num',a:49.7,tol:.1},{k:'a',l:'Si un nadador abandona, ¿llega FIN_CARRERA a 1?',t:'sel',o:SINO,a:'no'}],sol:'<p>2³² ms ≈ 4,29·10⁹ ms ≈ <strong>49,7 días</strong>. Si un nadador abandona, FIN_CALLES nunca llega a 8 y el sistema se queda en Carrera indefinidamente.</p>'})},
 {title:'Riego: diagrama de estados',tag:'Problema U6-1',gen:fix({q:'El detector de sequedad entra por TIN0 (TMR0 con captura en ambos flancos). TIMER es la interrupción periódica de TMR2.',code:`CAP_ENTRADA  ...                 * Borra CAP en TER0
             TST.B  Seco
             BEQ    ACTIVA_VALV
             CLR.B  Seco
             BCLR   #5,PBDAT_L(A0)  * Cierra válvula de emergencia

 {title:'Riego: Plazo y Apertura',random:1,tag:'Problema U6-1, 3.2',gen(){ const H=rnd(0,15),T=rnd(0,15),P=rnd(0,3),R=[3,7,0xB,0xF][P],ap=(R*T)>>4,pl=((15-H)<<9)+(T<<11),t=pl/(66e6/16/240);

// ---------- corrección ----------
function check(f,val){ const s=String(val===undefined||val===null?'':val).trim(); if(s==='') return false; const t=f.t;
  if(t==='hex') return normHex(s)===normHex(f.a);
  if(t==='int') return s.replace(/[\s.]/g,'')===String(f.a);
  if(t==='num'){ const x=parseFloat(s.replace(/[\s]/g,'').replace(',','.')); return Number.isFinite(x)&&Math.abs(x-f.a)<=(f.tol===undefined?1e-9:f.tol)+1e-9; }
  if(t==='sel') return s===f.a;
  if(t==='bin'){ const x=s.replace(/^%/,''); return /^[01]+$/.test(x)&&parseInt(x,2)===parseInt(f.a,2); }
  if(t==='seq') return s.replace(/[\s"]/g,'').replace(',','.').toUpperCase()===String(f.a).toUpperCase();
  if(t==='txt') return (f.alt||[f.a]).includes(s.toUpperCase());
  return false; }

   <div class="btnrow"><button class="btn primary" data-a="check">Corregir</button>${def.random?'<button class="btn" data-a="new">Otro</button>':''}<span class="chip" data-chip>sin corregir</span></div>
   <details class="solution"><summary>Ver solución</summary><div class="body">${d.sol}</div></details>`; }
function doCheck(card){ const d=card._d; let n=0; d.f.forEach(f=>{ const e=card.querySelector(`[data-k="${f.k}"]`); const ok=check(f,e.value); e.classList.remove('ok','bad'); e.classList.add(ok?'ok':'bad'); if(ok)n++; });
  const chip=card.querySelector('[data-chip]'), full=n===d.f.length; chip.textContent=`${n} / ${d.f.length}`; chip.className='chip '+(full?'okc':'badc');
  if(full&&!card._counted){ card._counted=true; streak++; setStreak(); }
  card.querySelector('details.solution').open=true; }
TABS.forEach((T,ti)=>{
  const b=document.createElement('button'); b.className='rail-btn'+(ti===0?' active':''); b.dataset.tab=T.id; b.innerHTML=`<span class="t">${T.t}</span><span class="s">${T.s}</span>`; rail.appendChild(b);
  const sec=document.createElement('section'); sec.className='panel'+(ti===0?' active':''); sec.id='tab-'+T.id; main.appendChild(sec);
  if(T.quiz){ const c=document.createElement('div'); c.className='card'; sec.appendChild(c); initQuiz(c); return; }
  const intro=document.createElement('div'); intro.className='card'; intro.innerHTML=T.intro; sec.appendChild(intro);
  const h=document.createElement('div'); h.className='card'; h.innerHTML=HOJA; sec.appendChild(h);
  T.ex.forEach(def=>{ const c=document.createElement('div'); c.className='card'; sec.appendChild(c); renderEx(c,def);
    c.addEventListener('click',e=>{ const bt=e.target.closest('button'); if(!bt)return; if(bt.dataset.a==='check') doCheck(c); if(bt.dataset.a==='new'){ c._counted=false; renderEx(c,def);} }); });
});
rail.addEventListener('click',e=>{ const b=e.target.closest('.rail-btn'); if(!b)return; rail.querySelectorAll('.rail-btn').forEach(x=>x.classList.remove('active')); main.querySelectorAll('.panel').forEach(x=>x.classList.remove('active')); b.classList.add('active'); document.getElementById('tab-'+b.dataset.tab).classList.add('active'); window.scrollTo(0,0); });

function initQuiz(c){ const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  let order,qi,score; const start=()=>{ order=shuffle(QUIZ.map((_,i)=>i)); qi=0; score=0; draw(); };
  function draw(){ const q=QUIZ[order[qi]], opts=shuffle(q[1].map((t,i)=>({t,ok:i===0})));
    c.innerHTML=`<div class="btnrow" style="margin:0 0 12px"><span class="scorepill">Pregunta <strong>${qi+1}</strong> / ${QUIZ.length}</span><span class="scorepill">Aciertos: <strong>${score}</strong></span><button class="btn" data-r style="margin-left:auto">Reiniciar</button></div><div class="quiz-q">${esc(q[0])}</div><div class="quiz-opts">${opts.map((o,i)=>`<button class="quiz-opt" data-o="${i}">${esc(o.t)}</button>`).join('')}</div><div data-exp></div>`;
    c.querySelector('[data-r]').onclick=start;
    c.querySelectorAll('.quiz-opt').forEach(b=>b.onclick=()=>{ const o=opts[+b.dataset.o]; if(o.ok)score++; c.querySelectorAll('.quiz-opt').forEach(x=>{ x.disabled=true; if(opts[+x.dataset.o].ok) x.classList.add('ok'); }); if(!o.ok) b.classList.add('bad'); c.querySelector('[data-exp]').innerHTML=`<div class="quiz-exp">${esc(q[2])}</div>${qi<QUIZ.length-1?'<div class="btnrow"><button class="btn primary" data-n>Siguiente</button></div>':`<p style="margin-top:12px"><strong>Resultado: ${score} / ${QUIZ.length}</strong></p>`}`; const n=c.querySelector('[data-n]'); if(n) n.onclick=()=>{ qi++; draw(); }; }); }
  start(); }
})();
</script>
</html>
